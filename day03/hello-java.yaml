apiVersion: apps/v1
kind: Deployment
metadata:
  name: hello-java
  labels:
    app: hello-java
spec:
  replicas: 1
  selector:
    matchLabels:
      app: hello-java
  template:
    metadata:
      labels:
        app: hello-java
    spec:
      containers:
        - name: hello-java
          image: hello-java:1.0
          imagePullPolicy: IfNotPresent
          env:
            - name: NAME
              value: "Zohrab"
            - name: LOOP_SECONDS
              value: "5"
